[hearthstone_companion]
# 留空时自动检测本机默认目录和正在运行的 Hearthstone.exe 同目录 Logs。
log_path = ""
monitor_on_start = true

# 局势共享同时启用问答和开场/重连/结算回应；此兼容键的 false 对应默认免打扰。
llm_commentary_enabled = false
llm_data_consent = true
llm_min_priority = 5
llm_cooldown_seconds = 25
llm_critical_cooldown_seconds = 8
llm_max_reply_chars = 28
user_chat_quiet_window_seconds = 30
target_lanlan = ""

# 每日从 hsbg.cards 读取公共当前卡池，不发送牌局、卡牌 ID 或玩家信息。
card_catalog_network_enabled = true
card_catalog_refresh_hours = 24

overlay_enabled = true
overlay_auto_start = false
overlay_window_titles = "Hearthstone|炉石传说|爐石戰記|하스스톤"
overlay_height_percent = 32
overlay_font_size = 24
overlay_speed_px_per_second = 150
