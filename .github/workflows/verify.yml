# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --frozen --group dev
      - name: Run full Python test suite
        run: uv run pytest -q
      - name: Run Ruff
        run: uv run ruff check .
      - name: Compile Python sources
        run: >-
          uv run python -m compileall -q -f .
          -x "[/\\](.git|.venv|.pytest_cache|.ruff_cache|build|dist)[/\\]"
      - name: Check committed patch whitespace
        run: git show --check --format= HEAD

  hosted-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin-source
      - name: Check out pinned N.E.K.O SDK
        uses: actions/checkout@v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: 50e23ac5403fcddc96e0dfb9fc78075f32a2428e
          path: neko
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: neko/frontend/plugin-manager/package-lock.json
      - name: Install Hosted UI dependencies
        working-directory: neko/frontend/plugin-manager
        run: npm ci --ignore-scripts
      - name: Compile Hosted TSX surface
        run: |
          mkdir -p "$GITHUB_WORKSPACE/neko/plugin/plugins/hearthstone_companion"
          cp -a "$GITHUB_WORKSPACE/plugin-source/." "$GITHUB_WORKSPACE/neko/plugin/plugins/hearthstone_companion/"
          node "$GITHUB_WORKSPACE/neko/frontend/plugin-manager/scripts/check-hosted-tsx.mjs" "$GITHUB_WORKSPACE/neko/plugin/plugins/hearthstone_companion"

  verify:
    needs: [quality, hosted-ui]
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@50e23ac5403fcddc96e0dfb9fc78075f32a2428e
    with:
      plugin-id: hearthstone_companion
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: 50e23ac5403fcddc96e0dfb9fc78075f32a2428e
